name: Node tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: node-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Node tests
        run: |
          mkdir -p logs
          set -o pipefail
          npm test 2>&1 | tee logs/node-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-test-logs
          path: logs/
      - name: Publish failure issue
        if: failure() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = 'Node tests failure';
            const log = fs.existsSync('logs/node-tests.log') ? fs.readFileSync('logs/node-tests.log','utf8') : 'No test log; inspect setup.';
            const locations = log.split('\n').filter(l => /not ok|location:|\.test\.mjs:\d+/.test(l)).join('\n');
            const body = 'Run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + '\nCommit: ' + context.sha + '\n\n### Failure locations\n~~~text\n' + locations.slice(0,12000) + '\n~~~\n### Log\n~~~text\n' + log.slice(-30000) + '\n~~~';
            const issues = await github.paginate(github.rest.issues.listForRepo,{...context.repo,state:'open'});
            const existing = issues.find(i => !i.pull_request && i.title === title);
            if(existing) await github.rest.issues.createComment({...context.repo,issue_number:existing.number,body});
            else await github.rest.issues.create({...context.repo,title,body});
